-- ─── 17. RPC: register_contractor_payment ─────────────────────
-- Valida que la invoice esté en 'Collected', inserta el pago,
-- avanza la invoice a 'Paid' y registra en historial. Atómico.
create or replace function public.register_contractor_payment(
  p_invoice_id         bigint,
  p_amount_paid        numeric,
  p_payment_date       date,
  p_transfer_reference text    default null,
  p_bank_method        text    default null,
  p_notes              text    default null,
  p_back_dated         boolean default false,
  p_created_by         text    default null,
  p_exchange_rate      numeric default null
)
returns setof public.payments
language plpgsql security definer
set search_path = public
as $$
declare
  v_payment_id  bigint;
  v_status      text;
  v_currency    text;
begin
  select status, currency into v_status, v_currency
    from public.invoices where id = p_invoice_id for update;

  if not found then
    raise exception 'Invoice % not found', p_invoice_id;
  end if;
  if v_status <> 'Collected' then
    raise exception 'not_collected: invoice % status is %, must be Collected',
      p_invoice_id, v_status;
  end if;

  insert into public.payments (
    invoice_id, amount_paid, currency, exchange_rate,
    payment_date, transfer_reference, bank_method,
    notes, back_dated, created_by
  ) values (
    p_invoice_id, p_amount_paid, coalesce(v_currency,'USD'), p_exchange_rate,
    p_payment_date, p_transfer_reference, p_bank_method,
    p_notes, p_back_dated, p_created_by
  )
  returning id into v_payment_id;

  update public.invoices set status = 'Paid' where id = p_invoice_id;

  insert into public.invoice_status_history
    (invoice_id, from_status, to_status, changed_by, note)
  values
    (p_invoice_id,'Collected','Paid', p_created_by,'Contractor payment registered');

  return query select * from public.payments where id = v_payment_id;
end;
$$;

revoke all on function public.register_contractor_payment from public;
grant execute on function public.register_contractor_payment to authenticated;

-- ─── 18. RPC: provision_current_user ──────────────────────────
-- JIT provisioning de usuario Azure AD en cada login.
-- Lee JWT, mapea grupos → roles, hace upsert en public.users.
create or replace function public.provision_current_user()
returns jsonb
language plpgsql security definer
set search_path = public
as $$
declare
  v_user_id    uuid;
  v_email      text;
  v_full_name  text;
  v_oid        text;
  v_upn        text;
  v_groups     text[];
  v_roles      text[];
  v_row        public.users;
  v_jwt        jsonb;
  v_user_count integer;
  v_cfg        public.app_config;
begin
  v_jwt       := auth.jwt();
  v_user_id   := auth.uid();
  v_email     := coalesce(v_jwt->>'email', v_jwt->>'preferred_username');
  v_full_name := coalesce(v_jwt->>'name', v_jwt->>'full_name', v_email);
  v_oid       := coalesce(v_jwt->>'oid', v_jwt->>'sub', v_user_id::text);
  v_upn       := coalesce(v_jwt->>'upn', v_jwt->>'preferred_username', v_email);

  begin
    v_groups := array(select jsonb_array_elements_text(v_jwt->'groups'));
  exception when others then
    v_groups := '{}';
  end;

  select array_agg(distinct rm.role_name)
    into v_roles
    from public.role_mappings rm
   where rm.azure_group_name = any(v_groups);

  v_roles := coalesce(v_roles, '{}');

  select * into v_cfg from public.app_config where id = 1;
  select count(*) into v_user_count from public.users;

  if array_length(v_roles,1) is null then
    if v_user_count = 0
       or (v_cfg.admin_bootstrap_email is not null
           and lower(v_email) = lower(v_cfg.admin_bootstrap_email))
    then
      v_roles := array['Administrator'];
    end if;
  end if;

  insert into public.users (
    id, email, full_name, upn, azure_oid, roles, is_active,
    first_login_at, last_login_at
  ) values (
    v_user_id, v_email, v_full_name, v_upn, v_oid, v_roles, true, now(), now()
  )
  on conflict (id) do update set
    email         = excluded.email,
    full_name     = excluded.full_name,
    upn           = excluded.upn,
    azure_oid     = excluded.azure_oid,
    roles         = excluded.roles,
    last_login_at = now();

  select * into v_row from public.users where id = v_user_id;
  return row_to_json(v_row)::jsonb;
end;
$$;

revoke all on function public.provision_current_user from public;
grant execute on function public.provision_current_user to authenticated;`;

const SQL_VIEWS = `-- ─── 19. Views ────────────────────────────────────────────────
create or replace view public.invoice_collection_totals
  with (security_invoker = true)
as
  select
    i.id                                as invoice_id,
    i.total_amount,
    coalesce(sum(c.amount_received),0)  as amount_collected,
    i.total_amount - coalesce(sum(c.amount_received),0) as outstanding
  from public.invoices i
  left join public.collections c on c.invoice_id = i.id
  group by i.id, i.total_amount;

create or replace view public.trace_view
  with (security_invoker = true)
as
  select
    te.id                               as time_entry_id,
    te.zoho_log_id,
    te.user_name,
    te.log_date,
    te.hours,
    te.client,
    te.project,
    te.task,
    te.description,
    te.status                           as zoho_status,
    te.synced_at,
    i.id                                as invoice_id,
    i.supplier_invoice_number,
    i.invoice_date,
    i.total_amount                      as invoice_amount,
    i.status                            as invoice_status,
    i.currency                          as invoice_currency,
    i.payment_terms_days,
    i.created_at                        as invoiced_at,
    i.created_by                        as invoiced_by,
    coalesce(ca.amount_collected,0)     as collected_amount,
    ca.last_collection_date,
    coalesce(ca.collection_count,0)     as collection_count,
    p.id                                as payment_id,
    p.amount_paid,
    p.payment_date,
    p.transfer_reference,
    p.bank_method,
    p.notes                             as payment_notes,
    p.created_at                        as paid_at,
    p.created_by                        as paid_by
  from public.time_entries te
  left join public.invoices i
    on i.entry_ids @> array[te.id]
  left join (
    select
      invoice_id,
      sum(amount_received)  as amount_collected,
      max(collection_date)  as last_collection_date,
      count(*)              as collection_count
    from public.collections
    group by invoice_id
  ) ca on ca.invoice_id = i.id
  left join public.payments p on p.invoice_id = i.id;`;

const EF_PROCESS_EMAIL = `// Edge Function: process-email-outbox
// Procesa pending rows de email_outbox y envía via Resend API.
// Requiere secret: RESEND_API_KEY
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const FROM_ADDRESS = "Southpoint Contractors <notifications@southpointlabs.com>";
const MAX_RETRIES = 3;
const CORS_HEADERS = {
  "Access-Control-Allow-Origin": "*",
  "Access-Control-Allow-Headers": "authorization, x-client-info, apikey, content-type",
  "Access-Control-Allow-Methods": "POST, OPTIONS",
};

function json(body, status = 200) {
  return new Response(JSON.stringify(body), {
    status, headers: { "Content-Type": "application/json", ...CORS_HEADERS },
  });
}

function buildHtml(subject, category, body) {
  const isPriority = category === "supplier_priority_alert";
  const accent = isPriority ? "#dc2626" : "#7c3aed";
  const badge = isPriority ? "PRIORITY — Action Required" : "Automated Alert";
  const bodyHtml = body.split("\\n")
    .map(line => line.trim()
      ? \`<p style="margin:0 0 8px;font-size:14px">\${line}</p>\`
      : "<br>")
    .join("");
  return \`<!DOCTYPE html><html><body style="background:#f4f4f5;font-family:system-ui">
  <table width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px"><tr><td>
  <table width="600" style="margin:0 auto;background:#fff;border-radius:12px;border:1px solid #e4e4e7">
    <tr><td style="background:#0a0a0a;padding:24px 32px">
      <p style="margin:0;color:#fff;font-size:18px;font-weight:700">SOUTHPOINT TECH LABS</p>
      <p style="margin:6px 0 0;color:#a0a0ab;font-size:12px">Contractors Management System</p>
    </td></tr>
    <tr><td style="height:4px;background:\${accent}"></td></tr>
    <tr><td style="padding:28px 32px 12px">
      <p style="margin:0;font-size:11px;font-weight:700;color:\${accent};text-transform:uppercase">\${badge}</p>
      <h1 style="margin:10px 0 0;font-size:20px;color:#09090b">\${subject}</h1>
    </td></tr>
    <tr><td style="padding:8px 32px 32px">\${bodyHtml}</td></tr>
    <tr><td style="padding:20px 32px;background:#f9f9fa;border-top:1px solid #e4e4e7">
      <p style="margin:0;font-size:12px;color:#a0a0ab">
        Mensaje automático. No responder.
      </p>
    </td></tr>
  </table></td></tr></table></body></html>\`;
}

Deno.serve(async (req) => {
  if (req.method === "OPTIONS") return new Response("ok", { headers: CORS_HEADERS });

  const resendKey = Deno.env.get("RESEND_API_KEY");
  if (!resendKey) return json({ ok: false, error: "RESEND_API_KEY not configured" });

  const supabase = createClient(
    Deno.env.get("SUPABASE_URL"),
    Deno.env.get("SUPABASE_SERVICE_ROLE_KEY"),
  );

  const { data: pending, error } = await supabase
    .from("email_outbox")
    .select("*")
    .is("sent_at", null)
    .is("failed_at", null)
    .lt("retry_count", MAX_RETRIES)
    .order("created_at", { ascending: true })
    .limit(50);

  if (error) return json({ ok: false, error: error.message });
  if (!pending?.length) return json({ ok: true, processed: 0, sent: 0, failed: 0 });

  let sent = 0, failed = 0;
  for (const email of pending) {
    if (!email.recipients?.length) {
      await supabase.from("email_outbox").update({ failed_at: new Date().toISOString() }).eq("id", email.id);
      failed++; continue;
    }
    let resErr = null;
    try {
      const res = await fetch("https://api.resend.com/emails", {
        method: "POST",
        headers: { Authorization: \`Bearer \${resendKey}\`, "Content-Type": "application/json" },
        body: JSON.stringify({
          from: FROM_ADDRESS,
          to: email.recipients,
          subject: email.subject,
          html: buildHtml(email.subject, email.category, email.body),
        }),
      });
      if (!res.ok) resErr = \`Resend \${res.status}: \${await res.text().catch(() => res.statusText)}\`;
    } catch (e) { resErr = e?.message ?? String(e); }

    if (!resErr) {
      await supabase.from("email_outbox").update({ sent_at: new Date().toISOString() }).eq("id", email.id);
      sent++;
    } else {
      const newRetry = (email.retry_count ?? 0) + 1;
      const upd = { retry_count: newRetry };
      if (newRetry >= MAX_RETRIES) upd.failed_at = new Date().toISOString();
      await supabase.from("email_outbox").update(upd).eq("id", email.id);
      failed++;
    }
  }
  return json({ ok: true, processed: pending.length, sent, failed });
});`;

const EF_SYNC = `// Edge Function: sync-time-logs
// Extrae time logs de Zoho Projects y hace upsert en time_entries.
// Requiere secrets: ZOHO_CLIENT_ID, ZOHO_CLIENT_SECRET, ZOHO_REFRESH_TOKEN
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const ZOHO_ACCOUNTS = "https://accounts.zoho.com";
const ZOHO_V3 = "https://projectsapi.zoho.com/api/v3";
const ZOHO_V1 = "https://projectsapi.zoho.com/restapi";

Deno.serve(async (req) => {
  if (req.method === "OPTIONS") return new Response("ok", {
    headers: { "Access-Control-Allow-Origin": "*",
               "Access-Control-Allow-Headers": "authorization, x-client-info, apikey, content-type" }
  });

  const supabase = createClient(
    Deno.env.get("SUPABASE_URL"),
    Deno.env.get("SUPABASE_SERVICE_ROLE_KEY"),
  );

  // 1. Obtener Access Token de Zoho con Refresh Token
  const tokenRes = await fetch(\`\${ZOHO_ACCOUNTS}/oauth/v2/token\`, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({
      grant_type:    "refresh_token",
      client_id:     Deno.env.get("ZOHO_CLIENT_ID"),
      client_secret: Deno.env.get("ZOHO_CLIENT_SECRET"),
      refresh_token: Deno.env.get("ZOHO_REFRESH_TOKEN"),
    }),
  });
  const { access_token } = await tokenRes.json();
  if (!access_token) throw new Error("No se pudo obtener access_token de Zoho");

  // 2. Obtener portal ID
  const portalData = await zohoGet(\`\${ZOHO_V1}/portals/\`, access_token);
  const portalId = portalData?.portals?.[0]?.id_string;

  // 3. Listar todos los proyectos
  const projectsData = await zohoGet(\`\${ZOHO_V1}/portal/\${portalId}/projects/\`, access_token);
  const projects = projectsData?.projects ?? [];

  const entries = [];
  const now = new Date();

  // 4. Para cada proyecto, obtener time logs de los últimos 12 meses
  for (const project of projects) {
    // Upsert proyecto en la tabla projects
    await supabase.from("projects").upsert({
      zoho_project_id: project.id_string,
      project_name:    project.name,
      project_number:  project.id_string,
      client:          project.owner_name ?? "—",
      zoho_status:     project.status,
    }, { onConflict: "zoho_project_id", ignoreDuplicates: false });

    for (let monthsBack = 0; monthsBack < 12; monthsBack++) {
      const d = new Date(now.getFullYear(), now.getMonth() - monthsBack, 1);
      const fromDate = \`\${d.getFullYear()}-\${String(d.getMonth()+1).padStart(2,'0')}-01\`;
      const toDate   = new Date(d.getFullYear(), d.getMonth()+1, 0)
                         .toISOString().slice(0,10);

      const url = \`\${ZOHO_V1}/portal/\${portalId}/projects/\${project.id_string}/logs/\`
                + \`?users_todo=all&bill_status=all&from_date=\${fromDate}&to_date=\${toDate}\`;
      const data = await zohoGet(url, access_token);
      const logs = data?.timelogs?.tasklogs ?? [];

      for (const log of logs) {
        entries.push({
          zoho_log_id:  log.id_string,
          user_name:    log.owner_name,
          project:      project.name,
          client:       project.owner_name ?? null,
          task:         log.task_name,
          task_number:  log.task_id_string ?? null,
          description:  log.notes ?? null,
          log_date:     log.log_date,
          hours:        parseFloat(log.hours) || 0,
          status:       log.approval_status ?? null,
          synced_at:    new Date().toISOString(),
        });
      }
    }
  }

  // 5. Upsert en time_entries
  if (entries.length) {
    const { error } = await supabase.from("time_entries")
      .upsert(entries, { onConflict: "zoho_log_id", ignoreDuplicates: false });
    if (error) throw error;
  }

  // 6. Actualizar sync_status y sync_log
  await supabase.from("sync_status").upsert({
    id: 1, last_synced_at: new Date().toISOString(),
    last_status: "OK", last_records_count: entries.length,
  });
  await supabase.from("sync_log").insert({
    status: "OK", records_count: entries.length,
  });

  return new Response(JSON.stringify({ ok: true, records: entries.length }),
    { headers: { "Content-Type": "application/json" } });
});

async function zohoGet(url, token) {
  for (let attempt = 0; attempt < 4; attempt++) {
    const res = await fetch(url, { headers: { Authorization: "Zoho-oauthtoken " + token } });
    if (res.status >= 500) { await new Promise(r => setTimeout(r, [2000,4000,8000][attempt] ?? 8000)); continue; }
    if (!res.ok) return null;
    const text = await res.text();
    if (!text?.trim()) return null;
    try { return JSON.parse(text); } catch { return null; }
  }
  return null;
}`;

const EF_CONTRACT_ALERTS = `// Edge Function: project-contract-alerts
// Cron diario. Detecta proyectos con contrato próximo a vencer
// y encola emails en email_outbox según los umbrales configurados.
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

Deno.serve(async (req) => {
  if (req.method === "OPTIONS") return new Response("ok");

  const supabase = createClient(
    Deno.env.get("SUPABASE_URL"),
    Deno.env.get("SUPABASE_SERVICE_ROLE_KEY"),
  );

  const { data: cfg } = await supabase
    .from("contract_alert_settings").select("*").eq("id", 1).single();

  if (!cfg?.email_recipients?.length) {
    return new Response(JSON.stringify({ ok: true, skipped: "no recipients" }));
  }

  const { data: projects } = await supabase
    .from("projects")
    .select("id, project_name, contract_number, contract_expiration_date")
    .not("contract_expiration_date", "is", null);

  const today = new Date();
  const thresholds = [cfg.threshold_1_days, cfg.threshold_2_days, cfg.threshold_3_days];
  const emails = [];

  for (const project of projects ?? []) {
    const exp = new Date(project.contract_expiration_date);
    const daysLeft = Math.round((exp - today) / 86400000);

    for (const threshold of thresholds) {
      if (daysLeft > threshold || daysLeft < 0) continue;

      // Anti-spam: verificar si ya se mandó alerta para este threshold
      if (cfg.email_frequency === "on_threshold_cross") {
        const { data: existing } = await supabase
          .from("contract_alert_log")
          .select("id")
          .eq("project_id", project.id)
          .eq("threshold_days", threshold)
          .gte("email_sent_at", new Date(Date.now() - 30*86400000).toISOString())
          .limit(1);
        if (existing?.length) continue;
      }

      const subject = daysLeft <= 0
        ? \`⛔ Contract Expired: \${project.project_name}\`
        : \`⚠️ Contract Expiring in \${daysLeft} days: \${project.project_name}\`;

      const body = [
        \`Project: \${project.project_name}\`,
        project.contract_number ? \`Contract: \${project.contract_number}\` : "",
        daysLeft <= 0
          ? \`The contract expired \${Math.abs(daysLeft)} day(s) ago.\`
          : \`The contract expires in \${daysLeft} day(s) (\${project.contract_expiration_date}).\`,
        "",
        "Please take action to renew or extend the contract.",
      ].filter(Boolean).join("\\n");

      emails.push({
        recipients: cfg.email_recipients,
        subject, body,
        category: "contract_alert",
      });

      await supabase.from("contract_alert_log").insert({
        project_id: project.id,
        threshold_days: threshold,
        days_remaining: daysLeft,
      });
    }
  }

  if (emails.length) await supabase.from("email_outbox").insert(emails);

  return new Response(JSON.stringify({ ok: true, queued: emails.length }),
    { headers: { "Content-Type": "application/json" } });
});`;

const EF_COLLECTION_ALERTS = `// Edge Function: collection-alerts
// Cron diario. Detecta facturas Invoiced con cobro vencido o
// próximo a vencer y encola emails en email_outbox.
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

Deno.serve(async (req) => {
  if (req.method === "OPTIONS") return new Response("ok");

  const supabase = createClient(
    Deno.env.get("SUPABASE_URL"),
    Deno.env.get("SUPABASE_SERVICE_ROLE_KEY"),
  );

  const { data: cfg } = await supabase
    .from("collection_alert_settings").select("*").eq("id", 1).single();

  if (!cfg?.email_recipients?.length) {
    return new Response(JSON.stringify({ ok: true, skipped: "no recipients" }));
  }

  const { data: invoices } = await supabase
    .from("invoices")
    .select("id, supplier_invoice_number, invoice_date, total_amount, user_name, payment_terms_days")
    .eq("status", "Invoiced");

  const today = new Date();
  const overdueLines = [];
  const warningLines = [];

  for (const inv of invoices ?? []) {
    const invoiceDate = new Date(inv.invoice_date);
    const dueDate = new Date(invoiceDate.getTime() + (inv.payment_terms_days ?? 30) * 86400000);
    const daysPending = Math.round((today - invoiceDate) / 86400000);
    const daysUntilDue = Math.round((dueDate - today) / 86400000);

    if (daysUntilDue < 0) {
      overdueLines.push(
        \`  · \${inv.supplier_invoice_number} (\${inv.user_name}) — overdue \${Math.abs(daysUntilDue)} day(s), USD \${inv.total_amount}\`
      );
    } else if (daysUntilDue <= cfg.warning_days_before_due) {
      warningLines.push(
        \`  · \${inv.supplier_invoice_number} (\${inv.user_name}) — due in \${daysUntilDue} day(s), USD \${inv.total_amount}\`
      );
    }
  }

  if (!overdueLines.length && !warningLines.length) {
    return new Response(JSON.stringify({ ok: true, queued: 0 }));
  }

  const bodyParts = [];
  if (overdueLines.length) {
    bodyParts.push(\`OVERDUE (\${overdueLines.length}):\\n\${overdueLines.join("\\n")}\`);
  }
  if (warningLines.length) {
    bodyParts.push(\`DUE SOON (\${warningLines.length}):\\n\${warningLines.join("\\n")}\`);
  }

  await supabase.from("email_outbox").insert({
    recipients: cfg.email_recipients,
    subject: \`Collection Alert — \${overdueLines.length} overdue, \${warningLines.length} due soon\`,
    body: bodyParts.join("\\n\\n"),
    category: "collection_alert",
  });

  return new Response(JSON.stringify({ ok: true, queued: 1 }),
    { headers: { "Content-Type": "application/json" } });
});`;

const EF_PAYMENT_ALERTS = `// Edge Function: payment-alerts
// Cron diario. Detecta facturas Collected con pago al contractor
// vencido o próximo a vencer y encola emails en email_outbox.
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

Deno.serve(async (req) => {
  if (req.method === "OPTIONS") return new Response("ok");

  const supabase = createClient(
    Deno.env.get("SUPABASE_URL"),
    Deno.env.get("SUPABASE_SERVICE_ROLE_KEY"),
  );

  const { data: cfg } = await supabase
    .from("payment_alert_settings").select("*").eq("id", 1).single();

  if (!cfg?.email_recipients?.length) {
    return new Response(JSON.stringify({ ok: true, skipped: "no recipients" }));
  }

  const { data: invoices } = await supabase
    .from("invoices")
    .select("id, supplier_invoice_number, total_amount, user_name, payment_terms_days")
    .eq("status", "Collected");

  const { data: collections } = await supabase
    .from("collections")
    .select("invoice_id, collection_date")
    .order("collection_date", { ascending: false });

  const lastCollByInvoice = new Map();
  for (const c of collections ?? []) {
    if (!lastCollByInvoice.has(c.invoice_id)) lastCollByInvoice.set(c.invoice_id, c.collection_date);
  }

  const today = new Date();
  const overdueLines = [];
  const warningLines = [];

  for (const inv of invoices ?? []) {
    const collDate = new Date(lastCollByInvoice.get(inv.id) ?? inv.invoice_date ?? today);
    const dueDate = new Date(collDate.getTime() + (inv.payment_terms_days ?? 30) * 86400000);
    const daysUntilDue = Math.round((dueDate - today) / 86400000);

    if (daysUntilDue < 0) {
      overdueLines.push(\`  · \${inv.supplier_invoice_number} (\${inv.user_name}) — overdue \${Math.abs(daysUntilDue)}d, USD \${inv.total_amount}\`);
    } else if (daysUntilDue <= cfg.warning_days_before_due) {
      warningLines.push(\`  · \${inv.supplier_invoice_number} (\${inv.user_name}) — due in \${daysUntilDue}d, USD \${inv.total_amount}\`);
    }
  }

  if (!overdueLines.length && !warningLines.length) {
    return new Response(JSON.stringify({ ok: true, queued: 0 }));
  }

  const bodyParts = [];
  if (overdueLines.length) bodyParts.push(\`OVERDUE:\\n\${overdueLines.join("\\n")}\`);
  if (warningLines.length) bodyParts.push(\`DUE SOON:\\n\${warningLines.join("\\n")}\`);

  await supabase.from("email_outbox").insert({
    recipients: cfg.email_recipients,
    subject: \`Payment Alert — \${overdueLines.length} overdue, \${warningLines.length} due soon\`,
    body: bodyParts.join("\\n\\n"),
    category: "payment_alert",
  });

  return new Response(JSON.stringify({ ok: true, queued: 1 }),
    { headers: { "Content-Type": "application/json" } });
});`;

const EF_SUPPLIER_ALERTS = `// Edge Function: supplier-contract-alerts
// Cron diario. Detecta supplier contracts próximos a vencer.
// Suppliers prioritarios reciben email diario; no-prioritarios
// reciben uno por umbral cruzado. Saltea Archived y "Renewal in Progress".
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

Deno.serve(async (req) => {
  if (req.method === "OPTIONS") return new Response("ok");

  const supabase = createClient(
    Deno.env.get("SUPABASE_URL"),
    Deno.env.get("SUPABASE_SERVICE_ROLE_KEY"),
  );

  const { data: cfg } = await supabase
    .from("supplier_alert_settings").select("*").eq("id", 1).single();

  if (!cfg?.email_recipients?.length && !cfg?.priority_supplier_email_recipients?.length) {
    return new Response(JSON.stringify({ ok: true, skipped: "no recipients" }));
  }

  const { data: contracts } = await supabase
    .from("supplier_contracts")
    .select("*")
    .eq("archived", false)
    .neq("status", "Renewal in Progress");

  const today = new Date();
  const thresholds = [cfg.threshold_1_days, cfg.threshold_2_days, cfg.threshold_3_days];
  let queued = 0;

  for (const contract of contracts ?? []) {
    const exp = new Date(contract.expiration_date);
    const daysLeft = Math.round((exp - today) / 86400000);

    const matchedThreshold = thresholds.find(t => daysLeft <= t && daysLeft >= 0);
    if (!matchedThreshold && daysLeft >= 0) continue;

    const isPriority = contract.is_priority_supplier;
    const recipients = isPriority
      ? (cfg.priority_supplier_email_recipients?.length
          ? cfg.priority_supplier_email_recipients
          : cfg.email_recipients)
      : cfg.email_recipients;

    if (!recipients?.length) continue;

    // Anti-spam: non-priority → una sola vez por threshold
    if (!isPriority && matchedThreshold) {
      const { data: existing } = await supabase
        .from("supplier_alert_log")
        .select("id")
        .eq("contract_id", contract.id)
        .eq("threshold_crossed", matchedThreshold)
        .not("email_sent_at", "is", null)
        .limit(1);
      if (existing?.length) continue;
    }

    const subject = daysLeft <= 0
      ? \`⛔ Supplier Contract Expired: \${contract.supplier_name} (\${contract.contract_number})\`
      : \`\${isPriority ? "🔴 " : "⚠️ "}\${contract.supplier_name} contract expires in \${daysLeft} days\`;

    const body = [
      \`Supplier: \${contract.supplier_name}\`,
      \`Contract: \${contract.contract_number}\`,
      \`Expiration: \${contract.expiration_date}\`,
      daysLeft <= 0 ? \`Status: EXPIRED (\${Math.abs(daysLeft)} days ago)\` : \`Days remaining: \${daysLeft}\`,
      \`Payment terms: \${contract.payment_terms}\`,
      "",
      isPriority ? "This is a PRIORITY supplier. Immediate action required." : "Please review renewal options.",
    ].join("\\n");

    await supabase.from("email_outbox").insert({
      recipients,
      subject, body,
      category: isPriority ? "supplier_priority_alert" : "supplier_alert",
    });

    await supabase.from("supplier_alert_log").insert({
      contract_id: contract.id,
      threshold_crossed: matchedThreshold ?? 0,
      email_sent_at: new Date().toISOString(),
    });

    queued++;
  }

  return new Response(JSON.stringify({ ok: true, queued }),
    { headers: { "Content-Type": "application/json" } });
});`;

  let y = MARGIN;

  // ── Helpers ─────────────────────────────────────────────────────
  function newPage() {
    doc.addPage();
    pageNum++;
    y = MARGIN;

    doc.rect(0, 0, W, 10, 'F');

    doc.text(`Pág. ${pageNum}`, W - MARGIN, 6.5, { align: 'right' });
    y = 16;
  }

  function checkPage(needed = 12) {
    if (y + needed > H - 12) newPage();
  }

  function sectionTitle(title, color = '#7c3aed') {
    checkPage(18);
    doc.setFillColor(color);
    doc.rect(MARGIN, y, TEXT_W, 8, 'F');
    doc.setFontSize(11); doc.setFont('helvetica', 'bold');
    doc.setTextColor('#ffffff');
    doc.text(title, MARGIN + 3, y + 5.5);

  function h2(text) {
    checkPage(10);
    doc.setFontSize(9.5); doc.setFont('helvetica', 'bold');

    doc.setDrawColor('#e5e7eb');
    doc.line(MARGIN, y + 5, W - MARGIN, y + 5);
    doc.text(text, MARGIN, y + 3.5);
    y += 9;
  }

  function para(text, size = 9, color = '#374151') {
    doc.setFontSize(size); doc.setFont('helvetica', 'normal');
    doc.setTextColor(color);
    const lines = doc.splitTextToSize(text, TEXT_W);
    for (const line of lines) {
      checkPage(5);
      doc.text(line, MARGIN, y);
      y += 4.5;
    }
    y += 1;
  }

  function codeBlock(code, title = '') {
    const lines = code.split('\n');
    const lineH = 3.8;
    const pad = 3;
    const headerH = title ? 7 : 0;
    const totalH = lines.length * lineH + pad * 2 + headerH;
    const MAX_BLOCK = H - MARGIN * 2 - 20;

    // Split code into chunks that fit on a page
    const chunks = [];
    let chunk = [];
    let chunkH = pad * 2 + headerH;
    for (const line of lines) {
      if (chunkH + lineH > MAX_BLOCK && chunk.length > 0) {
        chunks.push([...chunk]);
        chunk = [];
        chunkH = pad * 2;
      }
      chunk.push(line);
      chunkH += lineH;
    }
    if (chunk.length) chunks.push(chunk);

    chunks.forEach((ch, ci) => {
      const blockH = ch.length * lineH + pad * 2 + (ci === 0 ? headerH : 0);
      checkPage(blockH + 4);

      doc.setFillColor(CODE_BG);
      doc.roundedRect(MARGIN, y, TEXT_W, blockH, 2, 2, 'F');

      let iy = y + pad;

      if (ci === 0 && title) {
        doc.setFontSize(7.5); doc.setFont('courier', 'bold');
        doc.setTextColor('#a78bfa');
        doc.text(title, MARGIN + pad, iy + 3.2);
        iy += headerH;
      }

      doc.setFontSize(6.3); doc.setFont('courier', 'normal');
      for (const line of ch) {
        if (iy > y + blockH - pad) break;
        doc.setTextColor(
          line.trimStart().startsWith('--') ? '#6b7280' :
          /^(create|insert|drop|alter|select|grant|revoke|update|delete)\b/i.test(line.trim()) ? '#93c5fd' :
          line.includes(':=') || line.includes('begin') || line.includes('end') || line.includes('return') ? '#86efac' :
          CODE_COLOR
        );
        const trimmed = doc.splitTextToSize(line, TEXT_W - pad * 2)[0] ?? '';
        doc.text(trimmed, MARGIN + pad, iy + 2.8);
        iy += lineH;
      }
      y += blockH + 3;
    });
  }
