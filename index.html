<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" id="theme-color-meta" content="#0A0A0A" />
    <meta
      name="description"
      content="Contractor payment management: review logged hours and process payments."
    />
    <!-- iOS: comportamiento de app instalada -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Payment" />
    <meta name="color-scheme" content="light dark" />

    <title>Contractor Payment Management</title>

    <!-- Montserrat (wordmark/headings) + Inter (UI) + JetBrains Mono (código/IDs) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica el tema ANTES del primer paint (evita flash del tema
      // incorrecto). ThemeProvider (src/lib/theme.jsx) reactiva sobre esto
      // mismo una vez React monta.
      ;(function () {
        // localStorage/matchMedia pueden tirar (p.ej. SecurityError) dentro de
        // un iframe sandbox como el de DOMO (*.domoapps.com). Envolvemos todo:
        // ante cualquier error caemos a tema claro y NO rompemos el primer paint.
        var dark = false
        try {
          var stored = localStorage.getItem('southpoint-theme')
          dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        } catch (e) {
          try { dark = matchMedia('(prefers-color-scheme: dark)').matches } catch (_) { dark = false }
        }
        document.documentElement.classList.toggle('dark', dark)
        var meta = document.getElementById('theme-color-meta')
        if (meta) meta.setAttribute('content', dark ? '#0A0A0A' : '#FAFAFA')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
